name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # TanStack Start requires Node >=22.12.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, whose handling of optional peer deps (unstorage's
      # lru-cache) disagrees with the npm 11 lockfile in this repo: `npm ci` aborts
      # with "Missing: lru-cache@11.5.2 from lock file". Match the npm that wrote it.
      - run: npm install -g npm@11

      - run: npm ci

      # GITHUB_ACTIONS is set automatically here, which switches vite.config.ts
      # to the static Pages build (sub-path base + prerender, nitro off).
      - run: npm run build

      # Stop GitHub Pages' Jekyll layer from touching the build output.
      - run: touch dist/client/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
